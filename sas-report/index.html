  <p style="font-family: 'Play', sans-serif; font-size: 12px; color: #252424; line-height: 5px; text-decoration: underline; font-weight: bold;">Reporte del: 01/SEP/26 - 1:00 P.M</p>
  <p style="font-family: 'Play', sans-serif; font-size: 11px; color: #fc3131; line-height: 5px; font-weight: bold;">Ingrese su número de identificación sin puntos, comas o espacios</p>

<input id="searchBox"  type="text" inputmode="numeric" pattern="[0-9]*" style="width:110px; text-align:center; font-family:'Play', sans-serif;">
<button id="data" disabled style="font-family: 'Play', sans-serif;">Buscar</button>
<button style="font-family: 'Play', sans-serif;" onclick="location.reload()">Nueva Busqueda</button>

<!-- TABLA NUEVA AGREGADA -->
<table id="speaking-table" border="2" align="center" style="width:100%; max-width:500px; text-align:center; display:none; margin-top:0px; border-radius:12px; border:2px solid #4A90E2; border-collapse:collapse; box-shadow:none;">
<tr>
<th style="font-family: 'Play', sans-serif; background-color:#004890; color:white; font-size: 14px">
SPEAKING MISTAKES</br>(Structure, Pronunciation and/or Vocabulary)
</th>
</tr>
<tr>
<td id="speaking-content" style="font-family: 'Play', sans-serif; background-color:#FFFFFF; color:#000000; font-size: 10px; text-align:left;"></td>
</tr>
</table>

<script>
const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSUJ194u5du58KMvik6ZgteUEDDxGmnzxJlEWlX19DwKLYo6sHnVJTKEmdUgygiVEfgJv74BC-DN7xI5eSQTjVSJad49SeLqKg3w30wsEaLgWW2uoSyVtVsPAcvr51ofWHnFv1oE9LWoMJpU-eAzFBy3GWsI87RI-FXDkrTCOeHBfUaIqkHxlMF7sWnq5gtW26Ea2jG0vlAXnJNgImKwg0n70UGq4X5bTpP7DavLIQcjmRtcT5HnBiA6wUkBlCnsXrhk2wJdBarymuPLVA_1bLn2BTuzw&lib=Mu5NpJW4jxF5LvXuxFZYY0QS2Lbk5W0yq";

let data = [];

fetch(API_URL + "?t=" + Date.now())
  .then(function(response) {
    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    return response.json();
  })
  .then(function(json) {

    if (!Array.isArray(json)) {
      throw new Error(json.message || "La API no devolvió un array.");
    }

    data = json;

    console.log("Datos cargados correctamente:", data.length);

    $("#data").prop("disabled", false);

  })
  .catch(function(error) {

    console.error("Error cargando los datos:", error);

    $("#info").html(
      "<span style='color:#fc3131;'>No fue posible cargar los datos. Intente nuevamente.</span>"
    );

  });


// BUSCAR ESTUDIANTE
$("#data").click(function(){

  var searchId = parseInt($("#searchBox").val(), 10);

  $("#info").html("");
  $("#speaking-content").html("");
  $("#speaking-table").hide();

  if (isNaN(searchId)) {

    $("#info").html(
      "<span style='color:#fc3131;'>Ingrese un número de identificación válido.</span>"
    );

    return;
  }

  var found = false;

  data.forEach(function(item){

    if(Number(item.id) === searchId){

      found = true;

      $("#info")
        .append("<br> <a style='color: grey;'> Nombre: </a>" + item.user.name)
        .append("<br> <a style='color: grey;'> Asignatura: </a>" + item.user.subject)
        .append("<br> <a style='color: grey;'> Límite de horas de inasistencia: </a>" + item.user.limit)
        .append("<br> <a style='color: grey;'> Número de horas de inasistencia: </a> <span style='color: #007054; text-decoration: underline;'>" + item.user.absences + "</span>")
        .append("<br> <a style='color: grey;'> Score 1 - </a> <span style='color: #fc3131; text-decoration: underline;'>" + item.user.score1 + "</span>")
        .append("<br> <a style='color: grey;'> Score 2 - </a> <span style='color: #2757F5; text-decoration: underline;'>" + item.user.score2 + "</span>")
        .append("<br> <a style='color: grey;'> Score 3 - </a> <span style='color: #fc3131; text-decoration: underline;'>" + item.user.score3 + "</span>")
        .append("<br> <a style='color: grey;'> Score 4 - </a> <span style='color: #fc3131; text-decoration: underline;'>" + item.user.score4 + "</span>")
        .append("<br> <a style='color: grey;'> Score 5 - </a> <span style='color: #fc3131; text-decoration: underline;'>" + item.user.score5 + "</span>")
        .append("<br> <a style='color: grey;'> Score 6 - </a> <span style='color: #fc3131; text-decoration: underline;'>" + item.user.score6 + "</span>");

      $("#speaking-content").append(item.user.speaking);

      $("#speaking-table").show();
    }

  });


  if(!found){

    $("#info").html(
      "<span style='color:#fc3131;'>No se encontró información para este número de identificación.</span>"
    );

  }

});


// ENTER PARA BUSCAR
document.getElementById("searchBox").addEventListener("keyup", function(event){

  if(event.key === "Enter"){

    document.getElementById("data").click();

  }

});


// MOSTRAR BOTÓN DE IMPRIMIR
$("#printBtn").show();


// IMPRIMIR
$("#printBtn").click(function(){

  $("#searchBox, #data, #printBtn, button[onclick]").hide();

  window.print();

  setTimeout(function(){

    $("#searchBox, #data, #printBtn, button[onclick]").show();

  }, 1000);

});


// DESACTIVAR MENÚ CONTEXTUAL
document.oncontextmenu = function(){

  return false;

};
</script>

    // Show elements again after printing
    setTimeout(function(){
        $("#searchBox, #data, #printBtn, button[onclick]").show();
    }, 1000);

});
</script>
