<!DOCTYPE html>
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Scores Report</title>

<link rel="icon" href="https://chalkboardlp.github.io/img/favicon.png" type="image/x-icon">

<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.1/jquery.min.js"></script>
<script src="https://kit.fontawesome.com/feede90dd1.js" crossorigin="anonymous"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap');
</style>

<style>
@media print {

    body {
        background: white;
    }

    #searchBox,
    #data,
    #printBtn,
    #newSearchBtn,
    #connectionStatus {
        display: none !important;
    }

    #info {
        margin-left: 10% !important;
        font-size: 14px;
    }

    #speaking-table {
        width: 90% !important;
    }

}
</style>

</head>

<body style="background-color:#FFFBF2; background-image: url('https://static.vecteezy.com/system/resources/thumbnails/080/645/944/small/seamless-square-grid-paper-texture-background-free-vector.jpg');">

<div style="position:relative;margin-left:auto;margin-right:auto;text-align:center;width:100%;max-width:650px;">

<img src="https://teacherchriser.github.io/images/Gnomio-Logo-01.png"
     height="120px"
     style="border: 0px solid navy; border-radius: 3px;">

<p style="font-family:'Play',sans-serif;font-size:8px;color:#252424;line-height:0px;font-weight:bold;">
Created & designed by: Teacher Christian Serrano
</p>

<p style="font-family:'Play',sans-serif;font-size:15px;color:#004890;line-height:0px;font-weight:bold;">
Reporte de Asistencia, Speaking y Notas
</p>

<!-- FECHA AUTOMÁTICA -->
<p id="reportDate"
   style="font-family:'Play',sans-serif;font-size:12px;color:#252424;line-height:5px;text-decoration:underline;font-weight:bold;">
Cargando fecha...
</p>

<p style="font-family:'Play',sans-serif;font-size:11px;color:#fc3131;line-height:5px;font-weight:bold;">
Ingrese su número de identificación sin puntos, comas o espacios
</p>

<input
    id="searchBox"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    style="width:110px;text-align:center;font-family:'Play',sans-serif;"
>

<button
    id="data"
    disabled
    style="font-family:'Play',sans-serif;">
    Buscar
</button>

<button
    id="newSearchBtn"
    style="font-family:'Play',sans-serif;"
    onclick="location.reload()">
    Nueva Busqueda
</button>

<button
    id="printBtn"
    style="font-family:'Play',sans-serif;display:none;"
    title="Save PDF/Print">
    <i class="fa-solid fa-print"></i>
</button>

<!-- ESTADO DE CONEXIÓN -->
<div
    id="connectionStatus"
    style="font-family:'Play',sans-serif;font-size:9px;color:#777;margin-top:6px;">
    ⏳ Conectando con Google Sheets...
</div>

<h5
    id="info"
    style="font-family:'Play',sans-serif;color:#004890;font-weight:bold;margin-top:3px;text-align:center;">
</h5>

</div>


<!-- TABLA SPEAKING -->

<table
    id="speaking-table"
    border="2"
    align="center"
    style="width:100%;max-width:500px;text-align:center;display:none;margin-top:0px;border-radius:12px;border:2px solid #4A90E2;border-collapse:collapse;box-shadow:none;">

<tr>

<th
    style="font-family:'Play',sans-serif;background-color:#004890;color:white;font-size:14px">

SPEAKING MISTAKES</br>
(Structure, Pronunciation and/or Vocabulary)

</th>

</tr>

<tr>

<td
    id="speaking-content"
    style="font-family:'Play',sans-serif;background-color:#FFFFFF;color:#000000;font-size:10px;text-align:left;">
</td>

</tr>

</table>


<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbyLG8wShW6ShHjrXfJy3poJOB6KZG6AkoQObVpJv1QT33V2_-MhTv9KVp4KYTR9nNrdOw/exec";

/* Actualizar cada 5 minutos */

const UPDATE_INTERVAL = 2 * 60 * 1000;


/* =========================================================
   VARIABLES
   ========================================================= */

let data = [];

let dataLoaded = false;


/* =========================================================
   FECHA Y HORA
   ========================================================= */

function updateReportDate() {

    const now = new Date();

    const months = [
        "ENE",
        "FEB",
        "MAR",
        "ABR",
        "MAY",
        "JUN",
        "JUL",
        "AGO",
        "SEP",
        "OCT",
        "NOV",
        "DIC"
    ];

    let day = String(now.getDate()).padStart(2, "0");

    let month = months[now.getMonth()];

    let year = String(now.getFullYear()).slice(-2);

    let hours = now.getHours();

    let minutes = String(now.getMinutes()).padStart(2, "0");

    let ampm = hours >= 12 ? "P.M" : "A.M";

    hours = hours % 12;

    if (hours === 0) {
        hours = 12;
    }

    document.getElementById("reportDate").innerHTML =
        "Reporte actualizado: " +
        day + "/" +
        month + "/" +
        year +
        " - " +
        hours + ":" +
        minutes + " " +
        ampm;
}


/* =========================================================
   CARGAR DATOS DESDE GOOGLE SHEETS
   ========================================================= */

function loadData() {

    $("#connectionStatus").html(
        "⏳ Actualizando datos..."
    );

    fetch(API_URL + "?t=" + Date.now())

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }

            return response.json();

        })

        .then(function(json) {

            if (!Array.isArray(json)) {

                throw new Error(
                    json.message ||
                    "La API no devolvió un array."
                );

            }

            data = json;

            dataLoaded = true;

            /* Habilitar búsqueda */

            $("#data").prop("disabled", false);

            /* Fecha/hora */

            updateReportDate();

            /* Estado */

            $("#connectionStatus").html("✓ Datos actualizados correctamente");

            $("#connectionStatus").css(
                "color",
                "#007054"
            );

            console.log(
                "Datos cargados correctamente:",
                data.length
            );

        })

        .catch(function(error) {

            console.error(
                "Error cargando datos:",
                error
            );

            /* Si nunca se cargaron los datos */

            if (!dataLoaded) {

                $("#connectionStatus").html(
                    "⚠ No fue posible conectar con Google Sheets"
                );

                $("#connectionStatus").css(
                    "color",
                    "#fc3131"
                );

                $("#info").html(
                    "<span style='color:#fc3131;'>" +
                    "No fue posible cargar los datos. " +
                    "Intente nuevamente." +
                    "</span>"
                );

            }

            /* Si ya había datos cargados */

            else {

                $("#connectionStatus").html(
                    "⚠ No se pudo actualizar. " +
                    "Se mantienen los datos anteriores."
                );

                $("#connectionStatus").css(
                    "color",
                    "#fc3131"
                );

            }

        });

}


/* =========================================================
   PRIMERA CARGA
   ========================================================= */

loadData();


/* =========================================================
   ACTUALIZACIÓN AUTOMÁTICA
   ========================================================= */

setInterval(function() {

    loadData();

}, UPDATE_INTERVAL);


/* =========================================================
   BUSCAR ESTUDIANTE
   ========================================================= */

$("#data").click(function() {

    var searchId =
        parseInt(
            $("#searchBox").val(),
            10
        );

    $("#info").html("");

    $("#speaking-content").html("");

    $("#speaking-table").hide();


    /* Validar número */

    if (isNaN(searchId)) {

        $("#info").html(
            "<span style='color:#fc3131;'>" +
            "Ingrese un número de identificación válido." +
            "</span>"
        );

        return;

    }


    /* Buscar */

    var found = false;


    data.forEach(function(item) {

        if (Number(item.id) === searchId) {

            found = true;


            $("#info")

                .append(
                    "<br> <a style='color:grey;'> Nombre: </a>" +
                    item.user.name
                )

                .append(
                    "<br> <a style='color:grey;'> Asignatura: </a>" +
                    item.user.subject
                )

                .append(
                    "<br> <a style='color:grey;'> Límite de horas de inasistencia: </a>" +
                    item.user.limit
                )

                .append(
                    "<br> <a style='color:grey;'> Número de horas de inasistencia: </a> " +
                    "<span style='color:#E00000;text-decoration:underline;'>" +
                    item.user.absences +
                    "</span>"
                )

                .append(
                    "<br> <a style='color:grey;'> Score 1 - </a> " +
                    "<span style='color:#00B549;text-decoration:underline;'>" +
                    item.user.score1 +
                    "</span>"
                )

                .append(
                    "<br> <a style='color:grey;'> Score 2 - </a> " +
                    "<span style='color:#00B549;text-decoration:underline;'>" +
                    item.user.score2 +
                    "</span>"
                )

                .append(
                    "<br> <a style='color:grey;'> Score 3 - </a> " +
                    "<span style='color:#00B549;text-decoration:underline;'>" +
                    item.user.score3 +
                    "</span>"
                )

                .append(
                    "<br> <a style='color:grey;'> Score 4 - </a> " +
                    "<span style='color:#00B549;text-decoration:underline;'>" +
                    item.user.score4 +
                    "</span>"
                )

                .append(
                    "<br> <a style='color:grey;'> Score 5 - </a> " +
                    "<span style='color:#00B549;text-decoration:underline;'>" +
                    item.user.score5 +
                    "</span>"
                )

                .append(
                    "<br> <a style='color:grey;'> Score 6 - </a> " +
                    "<span style='color:#00B549;text-decoration:underline;'>" +
                    item.user.score6 +
                    "</span>"
                );


            /* Speaking */

            $("#speaking-content").append(
                item.user.speaking
            );


            $("#speaking-table").show();

        }

    });


    /* No encontrado */

    if (!found) {

        $("#info").html(
            "<span style='color:#fc3131;'>" +
            "No se encontró información para este número de identificación." +
            "</span>"
        );

    }

});


/* =========================================================
   ENTER PARA BUSCAR
   ========================================================= */

document
.getElementById("searchBox")
.addEventListener(
    "keyup",
    function(event) {

        if (event.key === "Enter") {

            document
            .getElementById("data")
            .click();

        }

    }
);


/* =========================================================
   MOSTRAR BOTÓN IMPRIMIR
   ========================================================= */

$("#printBtn").show();


/* =========================================================
   IMPRIMIR
   ========================================================= */

$("#printBtn").click(function() {

    $(
        "#searchBox, #data, #printBtn, #newSearchBtn"
    ).hide();

    window.print();


    setTimeout(function() {

        $(
            "#searchBox, #data, #printBtn, #newSearchBtn"
        ).show();

    }, 1000);

});


/* =========================================================
   DESACTIVAR MENÚ CONTEXTUAL
   ========================================================= */

document.oncontextmenu = function() {

    return false;

};

</script>

</body>
</html>
